<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello, Pip! — Book 1 互動有聲英文繪本</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-cream: #fff9ef;
      --card-bg: #ffffff;
      --ink: #2d3142;
      --muted: #6c7280;
      --accent: #ff8c42;
      --accent-dark: #e67329;
      --mint: #52b788;
      --sky: #4ea8de;
      --sun: #ffd166;
      --mia-bubble: #fff3cd;
      --mia-border: #f4c430;
      --pip-bubble: #e6f7ed;
      --pip-border: #52b788;
      --mom-bubble: #fde8ef;
      --mom-border: #f284a8;
      --radius-lg: 24px;
      --shadow: 0 14px 36px rgba(45, 49, 66, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Nunito', 'Noto Sans TC', system-ui, sans-serif;
      background: radial-gradient(circle at top, #fffdf7 0%, #f9eedb 100%);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    button:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid var(--sky);
      outline-offset: 3px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid #f0e4ce;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.05rem;
    }

    .brand-badge {
      background: var(--mint);
      color: #fff;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 13px;
      border-radius: 999px;
      background: #f3ead8;
      font-weight: 700;
      font-size: 0.88rem;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .pill-btn:hover { background: #eadbc0; transform: translateY(-1px); }
    .pill-btn[aria-pressed="true"] {
      background: var(--sky);
      color: #fff;
    }
    .pill-btn.active-tab {
      background: var(--accent);
      color: #fff;
    }

    .stage-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 16px 10px;
    }

    .book-card {
      width: 100%;
      max-width: 980px;
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 3px solid #f2e5ce;
      display: flex;
      flex-direction: column;
    }

    .scene-view {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #fdf6e9;
      overflow: hidden;
    }

    .scene-view.tappable { cursor: pointer; }

    .tap-hint {
      position: absolute;
      bottom: 12px;
      left: 14px;
      background: rgba(255, 255, 255, 0.88);
      color: var(--ink);
      font-size: 0.82rem;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 999px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      pointer-events: none;
    }

    .scene-view.cover-mode {
      aspect-ratio: auto;
      min-height: 500px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      background: linear-gradient(135deg, #fff6e3 0%, #fdebd0 100%);
    }

    @media (max-width: 720px) {
      .scene-view.cover-mode { grid-template-columns: 1fr; }
    }

    .cover-art {
      width: 100%;
      height: 100%;
      max-height: 520px;
      object-fit: cover;
      display: block;
    }

    .cover-info {
      padding: 32px 28px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .cover-tag {
      background: var(--sun);
      color: #5c3d00;
      padding: 6px 16px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.9rem;
    }

    .cover-title {
      font-size: clamp(2.4rem, 5vw, 3.6rem);
      font-weight: 900;
      margin: 0;
      color: var(--ink);
      letter-spacing: -0.5px;
    }

    .cover-sub {
      margin: 0;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.55;
    }

    .cta-btn {
      background: var(--accent);
      color: #fff;
      font-size: 1.15rem;
      font-weight: 800;
      padding: 13px 30px;
      border-radius: 999px;
      box-shadow: 0 5px 0 var(--accent-dark);
      transition: transform 0.12s ease;
    }

    .cta-btn:hover { transform: translateY(-2px); }
    .cta-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--accent-dark); }

    .scene-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .warmup-stage {
      width: 100%;
      height: 100%;
      background: #fdf2dc;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .warmup-stage img {
      height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    .happy-stage {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #fff9d6 0%, #ffe6a7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .happy-stage img {
      height: 82%;
      max-height: 360px;
      border-radius: 24px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
      animation: bouncePop 1.6s ease-in-out infinite;
    }

    @keyframes bouncePop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .bubbles-layer {
      padding: 16px 22px 20px;
      background: #fffdf8;
      border-top: 2px solid #f4ebd9;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .bubble-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      flex: 1;
    }

    .speech-bubble {
      position: relative;
      padding: 12px 18px;
      border-radius: 20px;
      border: 3px solid;
      text-align: left;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      max-width: 100%;
    }

    .speech-bubble:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
    }

    .speech-bubble.talking {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 0 0 4px rgba(255, 140, 66, 0.38), 0 10px 22px rgba(0, 0, 0, 0.12);
    }

    .speech-bubble.mia { background: var(--mia-bubble); border-color: var(--mia-border); }
    .speech-bubble.pip { background: var(--pip-bubble); border-color: var(--pip-border); }
    .speech-bubble.mom { background: var(--mom-bubble); border-color: var(--mom-border); }

    .speaker-name {
      display: block;
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .line-text {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.3;
    }

    .kw {
      display: inline-block;
      background: #fff;
      color: #d9480f;
      padding: 1px 8px;
      border-radius: 10px;
      border: 2px dashed #ff922b;
      margin: 0 2px;
      cursor: pointer;
    }

    .kw:hover { background: #fff4e6; }

    .side-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .replay-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 1.35rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 var(--accent-dark);
      transition: transform 0.12s ease;
    }

    .replay-circle:hover { transform: scale(1.06); }

    .sfx-btn {
      padding: 10px 15px;
      border-radius: 16px;
      background: #edf2ff;
      color: #364fc7;
      font-weight: 800;
      font-size: 0.92rem;
      border: 2px solid #bac8ff;
    }

    .sfx-btn:hover { background: #dbe4ff; }

    .panel-page {
      padding: 26px 26px 30px;
      background: #fffdf8;
      min-height: 460px;
    }

    .panel-title {
      margin: 0 0 6px;
      font-size: 1.85rem;
      font-weight: 900;
      text-align: center;
    }

    .panel-desc {
      margin: 0 0 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .card-tile {
      background: #fff;
      border: 3px solid #f0e4ce;
      border-radius: 20px;
      padding: 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .card-tile:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .card-tile img {
      width: 100%;
      height: 165px;
      object-fit: cover;
      border-radius: 14px;
      background: #fff9ef;
    }

    .tile-word {
      font-size: 26px;
      font-weight: 900;
      color: var(--ink);
    }

    .tile-sub {
      font-size: 0.92rem;
      color: var(--muted);
    }

    .chant-card {
      background: #fff;
      border: 3px solid #f0e4ce;
      border-radius: 22px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .chant-card:hover { transform: translateY(-2px); border-color: var(--mint); }
    .chant-card img { width: 92px; height: 92px; border-radius: 16px; object-fit: cover; flex-shrink: 0; }
    .chant-line { font-size: 24px; font-weight: 900; color: var(--ink); display: block; margin-bottom: 4px; }
    .chant-act { font-size: 0.92rem; font-weight: 700; color: var(--mint); }

    .quiz-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .quiz-feedback {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 800;
      min-height: 36px;
      margin-top: 16px;
      color: var(--mint);
    }

    .win-box {
      text-align: center;
      padding: 36px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .trophy { font-size: 4.2rem; animation: bouncePop 1.4s ease-in-out infinite; }

    .song-controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 16px;
    }

    .song-verse {
      background: #fff;
      border: 3px solid #f0e4ce;
      border-radius: 22px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .song-verse h3 {
      margin: 0 0 4px;
      font-size: 1rem;
      color: var(--mint);
    }

    .song-line {
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      border-radius: 14px;
      background: #fffdf8;
      border: 2px solid #f2e5ce;
      font-size: 22px;
      font-weight: 800;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .song-line:hover { background: #fff4df; border-color: var(--accent); }
    .song-line.singing {
      background: #fff3cd;
      border-color: var(--accent);
      transform: scale(1.02);
      box-shadow: 0 6px 16px rgba(255, 140, 66, 0.2);
    }

    .guide-box {
      max-width: 760px;
      margin: 0 auto;
      background: #fff;
      border: 2px solid #f0e4ce;
      border-radius: 20px;
      padding: 20px 24px;
      line-height: 1.7;
    }

    .guide-box h3 { margin-top: 14px; margin-bottom: 6px; color: #c85a17; }
    .guide-box ul { padding-left: 20px; margin: 0; }

    .footer-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 980px;
      width: 100%;
      margin: 0 auto 18px;
      padding: 0 16px;
      gap: 12px;
    }

    .nav-btn {
      padding: 11px 22px;
      border-radius: 999px;
      background: #fff;
      border: 2px solid #e7d8be;
      font-weight: 800;
      font-size: 1rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .nav-btn:hover:not(:disabled) { background: #fff4df; border-color: var(--accent); }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .page-dots {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #dfd0b6;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .dot.active {
      background: var(--accent);
      transform: scale(1.3);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-badge">Book 1</span>
      <span>Hello, Pip!</span>
    </div>
    <nav class="controls" aria-label="Storybook controls">
      <button id="autoReadBtn" class="pill-btn" type="button" aria-pressed="true">
        🔊 自動朗讀：開啟
      </button>
      <button id="speedBtn" class="pill-btn" type="button" aria-pressed="false">
        🐢 慢速：關
      </button>
      <button id="jumpStoryBtn" class="pill-btn" type="button">📖 故事</button>
      <button id="jumpChantBtn" class="pill-btn" type="button">💃 動一動</button>
      <button id="jumpQuizBtn" class="pill-btn" type="button">⭐ 小遊戲</button>
      <button id="jumpSongBtn" class="pill-btn" type="button">🎵 兒歌</button>
      <button id="jumpDictBtn" class="pill-btn" type="button">🔤 小詞典</button>
    </nav>
  </header>

  <main class="stage-wrap">
    <article id="bookCard" class="book-card" aria-live="polite"></article>
  </main>

  <footer class="footer-nav">
    <button id="prevBtn" class="nav-btn" type="button">← 上一頁</button>
    <div id="pageDots" class="page-dots" role="tablist" aria-label="Page selector"></div>
    <button id="nextBtn" class="nav-btn" type="button">下一頁 →</button>
  </footer>

  <script>
    let slowMode = false;
    let autoRead = true;
    let currentAudio = null;
    let sequenceToken = 0;

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function getCtx() {
      if (!audioCtx && AudioCtx) audioCtx = new AudioCtx();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSfx(type) {
      const ctx = getCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === 'chime' || type === 'happy') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        osc.frequency.setValueAtTime(783.99, now + 0.16);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.start(now);
        osc.stop(now + 0.45);
      } else if (type === 'yawn') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.6);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
        osc.start(now);
        osc.stop(now + 0.65);
      } else if (type === 'grumble') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, now);
        osc.frequency.linearRampToValueAtTime(75, now + 0.4);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.start(now);
        osc.stop(now + 0.45);
      } else if (type === 'sad' || type === 'oops') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.linearRampToValueAtTime(240, now + 0.35);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    }

    function clearTalkingHighlights() {
      document.querySelectorAll('.speech-bubble.talking').forEach(el => el.classList.remove('talking'));
    }

    let songTimers = [];

    function clearSongTimers() {
      songTimers.forEach(id => clearTimeout(id));
      songTimers = [];
      document.querySelectorAll('.song-line.singing').forEach(el => el.classList.remove('singing'));
    }

    function stopAllAudio() {
      sequenceToken++;
      clearSongTimers();
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      clearTalkingHighlights();
    }

    function speakFallback(text, speaker = 'mia', onEnd = null, bubbleEl = null) {
      if (!('speechSynthesis' in window)) {
        if (onEnd) onEnd();
        return;
      }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = slowMode ? 0.74 : 0.96;
      u.pitch = speaker === 'pip' ? 1.55 : speaker === 'mom' ? 0.95 : 1.2;
      if (bubbleEl) bubbleEl.classList.add('talking');
      u.onend = () => {
        if (bubbleEl) bubbleEl.classList.remove('talking');
        if (onEnd) onEnd();
      };
      u.onerror = () => {
        if (bubbleEl) bubbleEl.classList.remove('talking');
        if (onEnd) onEnd();
      };
      window.speechSynthesis.speak(u);
    }

    function playClip(file, fallbackText, speaker = 'mia', onEnd = null, bubbleEl = null, keepToken = false) {
      const token = keepToken ? sequenceToken : ++sequenceToken;
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      clearTalkingHighlights();

      if (!file) {
        speakFallback(fallbackText, speaker, onEnd, bubbleEl);
        return;
      }
      const audio = new Audio(`assets/audio/${file}`);
      currentAudio = audio;
      audio.playbackRate = slowMode ? 0.78 : 1.0;
      if (bubbleEl) bubbleEl.classList.add('talking');

      const finish = () => {
        if (bubbleEl) bubbleEl.classList.remove('talking');
        if (currentAudio === audio) currentAudio = null;
        if (token === sequenceToken && onEnd) onEnd();
      };

      audio.addEventListener('ended', finish, { once: true });
      audio.addEventListener('error', () => {
        if (currentAudio === audio) currentAudio = null;
        if (token === sequenceToken) speakFallback(fallbackText, speaker, onEnd, bubbleEl);
      }, { once: true });

      audio.play().catch(() => {
        if (currentAudio === audio) currentAudio = null;
        if (token === sequenceToken) speakFallback(fallbackText, speaker, onEnd, bubbleEl);
      });
    }

    function speakSequence(lines) {
      const token = ++sequenceToken;
      let idx = 0;
      const bubbles = document.querySelectorAll('.speech-bubble');
      function next() {
        if (token !== sequenceToken || idx >= lines.length) return;
        const item = lines[idx];
        const bubbleEl = bubbles[idx] || null;
        idx++;
        playClip(item.audio, item.speak || item.text.replace(/\*\*/g, ''), item.speaker, () => {
          setTimeout(next, 240);
        }, bubbleEl, true);
      }
      next();
    }

    function playClipChain(clips) {
      const token = ++sequenceToken;
      let idx = 0;
      function next() {
        if (token !== sequenceToken || idx >= clips.length) return;
        const c = clips[idx++];
        playClip(c.file, c.text, c.speaker, () => {
          setTimeout(next, 220);
        }, null, true);
      }
      next();
    }

    const PAGES = [
      { type: 'cover' },
      {
        type: 'warmup',
        img: 'assets/warmup_mia_pip.jpg',
        alt: 'Mia and baby dinosaur Pip waving hello',
        sfx: { label: '✨ 打招呼音效', sound: 'chime' },

    function playNote(freq, durationSec = 0.25) {
      const ctx = getCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + durationSec);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + durationSec);
    }

    function playMelodyForLine(line, lineEl, withVocals) {
      const speedScale = slowMode ? 1.25 : 1.0;
      const step = line.stepMs * speedScale;
      if (lineEl) lineEl.classList.add('singing');
      line.notes.forEach((freq, i) => {
        const tid = setTimeout(() => playNote(freq, (step / 1000) * 0.9), i * step);
        songTimers.push(tid);
      });
      if (withVocals) {
        const audio = new Audio(`assets/audio/${line.file}`);
        currentAudio = audio;
        audio.playbackRate = slowMode ? 0.8 : 1.0;
        audio.play().catch(() => {});
      }
      return line.notes.length * step + 220;
    }

              </div>
              <div class="song-verse">
                <h3>Verse 2 · 難過變開心！</h3>
                ${v2.map((l, i) => renderLineBtn(l, i + 4)).join('')}
              </div>
            </div>
          </section>
        `;

        const yue2Player = document.getElementById('yue2Player');
        if (yue2Player) {
          yue2Player.playbackRate = slowMode ? 0.8 : 1.0;
          yue2Player.addEventListener('play', () => clearSongTimers());
        }

        const playFullSong = (withVocals) => {
          stopAllAudio();
          const lineBtns = document.querySelectorAll('.song-line');
          let delay = 0;
          SONG_LINES.forEach((line, idx) => {
            const tid = setTimeout(() => {
              document.querySelectorAll('.song-line.singing').forEach(el => el.classList.remove('singing'));
              playMelodyForLine(line, lineBtns[idx], withVocals);
            }, delay);
            songTimers.push(tid);
            const speedScale = slowMode ? 1.25 : 1.0;
            delay += line.notes.length * line.stepMs * speedScale + 260;
          });
          const endTid = setTimeout(() => clearSongTimers(), delay + 100);
          songTimers.push(endTid);
        };

        document.getElementById('singFullBtn').addEventListener('click', () => playFullSong(true));
        document.getElementById('singKaraokeBtn').addEventListener('click', () => playFullSong(false));
        document.getElementById('stopSongBtn').addEventListener('click', stopAllAudio);

        bookCard.querySelectorAll('.song-line').forEach(btn => {
          btn.addEventListener('click', () => {
            stopAllAudio();
            const line = SONG_LINES[Number(btn.dataset.sidx)];
            const dur = playMelodyForLine(line, btn, true);
            const tid = setTimeout(() => btn.classList.remove('singing'), dur);
            songTimers.push(tid);
          });
        });
        return;
      }

      if (page.type === 'dictionary') {
        bookCard.innerHTML = `
          <section class="panel-page">
            <h2 class="panel-title">Word Bank 有聲小詞典</h2>
            <p class="panel-desc">點擊單字卡或對話泡泡，複習本冊 6 個核心單字與生活對話！</p>
            <div class="grid-3">
              ${VOCAB.map(v => `
                <button type="button" class="card-tile" data-word="${v.word}">
                  <img src="${v.img}" alt="${v.word}" />
                  <span class="tile-word">${v.word}</span>
                  <span class="tile-sub">${v.zh}</span>
                </button>
              `).join('')}
            </div>
            <div style="display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap;">
              <button type="button" class="speech-bubble mia" data-say="How are you?">
                <span class="speaker-name">核心問句 🔊</span>
                <span class="line-text">How are you?</span>
              </button>
              <button type="button" class="speech-bubble pip" data-say="I'm happy!">
                <span class="speaker-name">核心回答 🔊</span>
                <span class="line-text">I'm happy!</span>
              </button>
            </div>
          </section>
        `;
        bookCard.querySelectorAll('.card-tile').forEach((c, i) => {
          c.addEventListener('click', () => playClip(VOCAB[i].audio, c.dataset.word, 'mia'));
        });
        bookCard.querySelectorAll('.speech-bubble').forEach((b, i) => {
          b.addEventListener('click', () => playClip(i === 0 ? 'dict_q.mp3' : 'dict_a.mp3', b.dataset.say, i === 0 ? 'mia' : 'pip', null, b));
        });
        return;
      }

      if (page.type === 'guide') {
        bookCard.innerHTML = `
          <section class="panel-page">
            <h2 class="panel-title">家長導讀與生活練習</h2>
            <p class="panel-desc">不用背單字，把繪本裡的問候帶進每天的親子對話中</p>
            <div class="guide-box">
              <h3>📖 故事中文大意</h3>
              <p>早晨陽光灑進房間，Mia 叫醒愛睏的小恐龍 Pip（<em>I'm sleepy</em>）。Pip 一起床就喊肚子餓（<em>I'm hungry</em>），但客廳的餅乾罐卻空空的，Pip 難過得掉眼淚（<em>I'm sad</em>）。還好媽媽端來剛烤好的星星餅乾和牛奶，Pip 吃飽後開心地跳起來（<em>I'm happy</em>），還分給 Mia 吃，最後一起開心地揮手說再見（<em>Bye-bye</em>）！</p>
              <h3>💡 親子生活 3 個小練習</h3>
              <ul>
                <li><strong>起床問候</strong>：早上叫孩子起床時，微笑說一句 <em>"Good morning! Hello!"</em>。</li>
                <li><strong>情緒表達</strong>：孩子想睡或肚子餓時，引導他模仿 Pip 說 <em>"I'm sleepy."</em> 或 <em>"I'm hungry!"</em>。</li>
                <li><strong>睡前問答</strong>：睡前互相問一句 <em>"How are you today?"</em>，用英文聊聊今天的心情。</li>
              </ul>
            </div>
          </section>
        `;
      }
    }

    function goToPage(index) {
      stopAllAudio();
      currentPage = Math.max(0, Math.min(PAGES.length - 1, index));
      renderPage(true);
    }

    prevBtn.addEventListener('click', () => goToPage(currentPage - 1));
    nextBtn.addEventListener('click', () => goToPage(currentPage + 1));

    autoReadBtn.addEventListener('click', () => {
      autoRead = !autoRead;
      autoReadBtn.setAttribute('aria-pressed', String(autoRead));
      autoReadBtn.textContent = autoRead ? '🔊 自動朗讀：開啟' : '🔇 自動朗讀：關閉';
    });

    speedBtn.addEventListener('click', () => {
      slowMode = !slowMode;
      speedBtn.setAttribute('aria-pressed', String(slowMode));
      speedBtn.textContent = slowMode ? '🐢 慢速：開 (0.8x)' : '🐢 慢速：關';
    });

    document.getElementById('jumpStoryBtn').addEventListener('click', () => goToPage(1));
    document.getElementById('jumpChantBtn').addEventListener('click', () => goToPage(PAGES.findIndex(p => p.type === 'chant')));
    document.getElementById('jumpQuizBtn').addEventListener('click', () => {
      quizOrder = shuffle(EMOTIONS);
      quizIndex = 0;
      quizScore = 0;
      quizLocked = false;
      goToPage(PAGES.findIndex(p => p.type === 'quiz'));
    });
    document.getElementById('jumpSongBtn').addEventListener('click', () => goToPage(PAGES.findIndex(p => p.type === 'song')));
    document.getElementById('jumpDictBtn').addEventListener('click', () => goToPage(PAGES.findIndex(p => p.type === 'dictionary')));

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') goToPage(currentPage + 1);
      if (e.key === 'ArrowLeft') goToPage(currentPage - 1);
    });

    renderPage(false);
  </script>
</body>
</html>
